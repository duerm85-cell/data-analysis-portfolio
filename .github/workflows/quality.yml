name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-a-stock-quant-analysis
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            projects/01-a-stock-quant-analysis/requirements.txt
            projects/01-a-stock-quant-analysis/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q -x 'archive([\\/]|$)' .
      - name: Collect tests
        run: python -m pytest --collect-only -q
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test public Streamlit pages
        env:
          QUANT_APP_MODE: portfolio
        run: python scripts/smoke_test_app.py
